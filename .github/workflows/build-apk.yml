name: Build APK

# For a repository that contains only photocraft-android.zip (the full source with the Android port).
# Run it by hand: Actions › Build APK › Run workflow; the APK is under "Artifacts" on the run page.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: photocraft-main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unpack the source
        working-directory: .
        run: unzip -q photocraft-android.zip

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: photocraft-main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the Rust library
        run: >
          cargo ndk -t arm64-v8a
          -o apps/photocraft-android/android/app/src/main/jniLibs
          build -p photocraft-android --release --locked

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        run: gradle -p apps/photocraft-android/android assembleRelease --no-daemon

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: photocraft-android-apk
          path: photocraft-main/apps/photocraft-android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
